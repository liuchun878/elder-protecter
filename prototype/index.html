<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>送药机器人 · 居家仿真（王阿姨 · 虚构人物）</title>
    <meta name="description" content="独居老人按时送药 + 取药确认 + 漏服追溯的软件闭环仿真演示（虚构人物，非医疗用途）" />
    <link rel="stylesheet" href="./css/hud.css" />
    <!-- 内联 data URI 图标：避免浏览器自动请求 /favicon.ico（仍然零外部请求） -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232f7f86'/%3E%3Ccircle cx='11' cy='14' r='3' fill='%23ffffff'/%3E%3Ccircle cx='21' cy='14' r='3' fill='%23ffffff'/%3E%3Crect x='9' y='22' width='14' height='3' rx='1.5' fill='%23ffffff'/%3E%3C/svg%3E"
    />
    <!--
      挂载点归属（一个文件只有一条线改，见 prototype/AGENTS.md）：
        #scene   —— S 的 scene3d.js / scene2d.js 挂载 canvas
        #hud     —— R 的 hud.js 构建长者端大字叠层（3D 里不渲染任何文字）
        #family  —— H 的 family.js 构建家属端（副屏：?view=family）
        #debug   —— S 的 main.js 构建调试抽屉（默认隐藏，` 或 Ctrl/Cmd+Shift+D 唤出）
        #console —— S 的 controls.js 构建交互控制台（默认可见，拍摄模式下不挂载）
        #banner  —— 离线 / 存储不可用 / 3D 降级提示
    -->
  </head>
  <body>
    <div id="main-view" class="main-view">
      <div id="scene" class="scene" aria-hidden="true"></div>
      <div id="hud" class="hud"></div>
      <div id="banner" class="banner" hidden></div>
      <p class="stage-caption">
        送药机器人仿真 · 居家送药场景示意（虚构人物：王阿姨）· 取药 ≠ 服药 · 非医疗用途
      </p>
    </div>

    <div id="family" class="family-view" hidden></div>
    <!-- v1.19：固定演示的播放器与字幕（S 的 main.js 构建；拍摄模式下不挂载） -->
    <div id="player" class="player" hidden aria-label="固定演示播放器"></div>
    <!-- v1.14：左下角「演示控制条」——模式切换（自主点击 / 固定演示）+ 家属端副屏按钮（S 的 main.js 构建） -->
    <div id="dock" class="dock" aria-label="演示控制条"></div>
    <aside id="console" class="console" aria-label="演示交互控制台" hidden></aside>
    <aside id="debug" class="debug" hidden aria-label="演示调试抽屉"></aside>

    <!-- 离线红线：只加载本地 vendored 的 Three.js，无 CDN、无外部字体、无模型下载 -->
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/three.module.js"
        }
      }
    </script>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
