# ── 首个同步点（并行开发的生命线）─────────────────────────────────────────
critical_sync:
  at: D1AM
  must_finish_first: H0
  why: "R 与 S 依赖命令接口存在；空实现即可，不必完整逻辑"
  fallback: "若 H0 延后，R 与 S 先按契约写接入代码 + 用假数据自测，不空等"
