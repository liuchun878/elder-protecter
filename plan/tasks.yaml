# 机器可读任务板 —— 唯一真相
#
# 本文件是【任务 / 归属 / 状态】的机器可读真相。
# 与其它 Markdown 文档冲突时，以本文件为准。
# 人读版背景见: docs/三线分工与并行开发规范.md
# 接口真相（更高优先级）见: 契约-接口.md
#
# 状态枚举: todo | doing | review | done | cut
# 更新规则: 任何人改变任务状态都必须同时改本文件，并在 PR 里说明。

version: 3
updated: "2026-10-03"

repo:
  owner: liuchun878
  name: elder-protecter
  url: "https://github.com/liuchun878/elder-protecter"
  visibility: public
  default_branch: main
  note: "main 只接受里程碑合并；个人分支 feat/<r|s|h>-<主题>"

# ── 三线 ────────────────────────────────────────────────────────────────────
team:
  lines:
    R:
      name: 机器人线
      scope: 机器人本体 + 路径动画 + 长者端面板 + 提示通道
      duty: 让机器人会动、会说话；主讲 60 秒陈述
      github: "@TODO-R"      # ← 换成真实 GitHub 用户名
      budget_hours: 15
    S:
      name: 场景线
      scope: 房间/相机/光照/性能 + 演示时钟 + 装配 main.js + 集成门禁 + 录屏
      duty: 让世界看得见、让集成不出乱；执行每个里程碑的门禁与演示操作
      github: "@TODO-S"      # ← 换成真实 GitHub 用户名
      budget_hours: 16
    H:
      name: 人线
      scope: 王阿姨（3D 人形 + 状态与行为）+ 服药计划 + 事件状态机 + 记录 + 升级 + 家属端 + 契约
      duty: 让这件事真的成立；起草陈述脚本
      github: "@liuchun878"  # ← 队长
      budget_hours: 17
  lead: H

# 里程碑合并顺序（固定）：依赖单向，装配层最后
merge_order: [H, R, S]

# 交叉验证环（禁止自我验证）：H 的产出由 R 验，R 的由 S 验，S 的由 H 验
verification_ring:
  H: R
  R: S
  S: H

gate_executor: S          # 门禁执行人
contract_owner: H         # 契约变更发起人

# ── 闭环责任矩阵（每个环节都必须有主责，不留无主环节）──────────────────────
closed_loop_ownership:
  - { step: 1, name: 计划,       owner: H, assist: [] }
  - { step: 2, name: 时间,       owner: S, assist: [H] }
  - { step: 3, name: 到点判定,   owner: H, assist: [S] }
  - { step: 4, name: 送达,       owner: R, assist: [S, H] }
  - { step: 5, name: 提示,       owner: R, assist: [H] }
  - { step: 6, name: 取药确认,   owner: H, assist: [R] }
  - { step: 7, name: 记录,       owner: H, assist: [] }
  - { step: 8, name: 升级,       owner: H, assist: [R] }
  - { step: 9, name: 家属闭环,   owner: H, assist: [] }
  - { step: 10, name: 装配与门禁, owner: S, assist: [R, H] }
  - { step: 11, name: 陈述,      owner: R, assist: [H, S] }

# ── 里程碑 ─────────────────────────────────────────────────────────────────
milestones:
  - id: M0
    tag: p0-baseline
    status: done
    goal: 仓库骨架与流程就位
    gate: "本地历史完整；调研产物入库；尚无原型代码"
  - id: M0.5
    tag: p0.5-parallel-ready
    status: done
    goal: 契约冻结 + 三线归属 + agent 可读文档 + 仓库设置
    gate: "契约-接口.md v1.1 与三线一致；AGENTS.md 根/嵌套齐备；plan/tasks.yaml 可用；CODEOWNERS 就位"
  - id: M1
    tag: p1-contract-scene
    status: doing
    goal: 契约冻结 + 3D 骨架可见 + Three.js 离线验证
    gate: "页面可见房间/机器人/人形；断网刷新可加载；Network 零外部请求；命令接口空实现已可用"
    blocks: [D1AM]
  - id: M2
    tag: p2-happy-path
    status: todo
    goal: 场景 1 端到端（到点→送达→提示→取走→日志）
    gate: "验收脚本 5 步全过；双时间戳；重复取药被拦截"
    blocks: [D1PM]
  - id: M3
    tag: p3-escalation
    status: todo
    goal: 场景 3 升级链路（T+60s 换通道 → T+180s 通知家属 → 三选项 → 时间线）
    gate: "加速档 60 秒内完成升级；通知文本零补服建议；skipped_known 不计入依从失败"
    blocks: [D2AM]
  - id: M4
    tag: p4-plan-change
    status: todo
    goal: 场景 2 方案变更（临时加药 / 到期失效 / 冲突并列 / 暂停不删）
    gate: "第 8 天自动失效；冲突并列两条原始医嘱；换药后审计链完整"
    blocks: [D2AM]
  - id: M5
    tag: p5-frozen
    status: todo
    goal: 适老化走查 + 断网演练 + 演示机预检 → 功能冻结
    gate: "走查清单全项或登记已知偏差；断网下场景 1/3 可用；WebGL 与中文 TTS 体检通过"
    blocks: [D2PM1]
  - id: M6
    tag: p6-demo
    status: todo
    goal: 录屏兜底 + 连排 3 次 + 提交包定版
    gate: "连排 3 次不失误；三场景录屏各一条（含加速版）；提交清单齐备"
    blocks: [D2PM2]

